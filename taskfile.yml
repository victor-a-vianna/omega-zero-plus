  # beside them, as <name>:<libretro name>. gpSP's ships too, the way it always has
  SOURCE_CORES: picodrive:picodrive mesen:mesen stella2023:stella2023 atari800:atari800 prosystem:prosystem handy:handy hatari:hatari2014 quasi88:quasi88 np2kai:np2kai beetle_vb:mednafen_vb pokemini:pokemini gw:gw arduous:arduous beetle_wswan:mednafen_wswan sameduck:sameduck potator:potator tic80:tic80 jaxe:jaxe retro8:retro8 squirreljme:squirreljme vircon32:vircon32 uzem:uzem beetle_ngp:mednafen_ngp beetle_pce_fast:mednafen_pce_fast beetle_supergrafx:mednafen_supergrafx beetle_pcfx:mednafen_pcfx fbneo:fbneo mame2003_plus:mame2003_plus gp32emu:gp32emu vecx:vecx puae:puae snes9x:snes9x supafaust:mednafen_supafaust pcsx_rearmed:pcsx_rearmed
  H700_SOURCE_CORES: picodrive:picodrive mesen:mesen stella2023:stella2023 atari800:atari800 prosystem:prosystem handy:handy hatari:hatari2014 beetle_vb:mednafen_vb pokemini:pokemini gw:gw arduous:arduous beetle_wswan:mednafen_wswan sameduck:sameduck potator:potator tic80:tic80 jaxe:jaxe retro8:retro8 squirreljme:squirreljme vircon32:vircon32 uzem:uzem beetle_ngp:mednafen_ngp beetle_pce_fast:mednafen_pce_fast beetle_supergrafx:mednafen_supergrafx fbneo:fbneo mame2003_plus:mame2003_plus vecx:vecx snes9x:snes9x supafaust:mednafen_supafaust pcsx_rearmed:pcsx_rearmed

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Debug build of the whole workspace
    cmds:
      - cargo build --workspace

  release:
    desc: Release build of the slot binary
    cmds:
      - cargo build --release -p omega-zero

  test:
    desc: Run the whole test suite
    cmds:
      - cargo test --workspace --no-fail-fast

  test:timing:
    desc: >-
      Run the emulator's worker tests, which run against real time and so need a quiet
      machine: a shared CI runner skips them
    cmds:
      - cargo test -p omega-zero --test emu -- --ignored

  test:canvases:
    desc: >-
      Run the whole test suite again on every canvas but the default 720x480 one. The square
      720x720 canvas joins once the RG CubeXX layout lands
    cmds:
      - OMEGA_CANVAS=640x480 cargo test --workspace --no-fail-fast

  test:one:
    desc: Run tests matching FILTER, eg task test:one FILTER=gesture
    requires:
      vars: [FILTER]
    cmds:
      - cargo test --workspace --no-fail-fast {{.FILTER}}

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Fail if anything is unformatted
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy over all targets with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  lint:device:
    desc: Clippy the device build, which the host lint never compiles
    cmds:
      - cargo clippy -p omega-zero --no-default-features --features device,h700 -- -D warnings

  check:
    desc: Everything a CI run would do
    cmds:
      - task: fmt:check
      - task: lint
      - task: lint:device
      - task: test
      - task: test:timing
      - task: test:canvases
      - task: test:card

  test:card:
    desc: Test the scripts omega-zero ships on the card, off-device
    cmds:
      - sh card/test-link.sh
      - sh card/test-led.sh
      - sh card/test-coresave.sh
      - sh card/test-probe.sh
      - sh card/test-wifi.sh
      - sh card/test-bluetooth.sh

  screens:
    desc: >-
      Draw omega-zero's main screens headless into OUT, defaults to target/screens. Run it with
      OUT=target/screens-baseline before a change and screens:compare after it
    vars:
      OUT: '{{.OUT | default "target/screens"}}'
    cmds:
      - cargo run -q --release --example screens -p omega-zero -- {{.OUT}}

  screens:compare:
    desc: Draw the screens again and fail on any pixel that differs from BASELINE, defaults to target/screens-baseline
    vars:
      OUT: '{{.OUT | default "target/screens"}}'
      BASELINE: '{{.BASELINE | default "target/screens-baseline"}}'
    cmds:
      - cargo run -q --release --example screens -p omega-zero -- {{.OUT}} {{.BASELINE}}

  core:
    desc: >-
      Build mGBA and Supafaust and fetch gpSP, PicoDrive, Snes9x and pcsx_rearmed for this host. A missing
      core silently runs the mock (a test pattern and a sine tone) instead
    cmds:
      - task: core:mgba:host
      - task: core:gpsp:host
      - task: core:picodrive:host
      - task: core:mesen:host
      - task: core:snes9x:host
      - task: core:supafaust:host
      - task: core:pcsx:host

  core:mgba:host:
    desc: Build mgba_libretro for this host from the pinned libretro/mgba commit and cores/mgba's patches
    status:
      - test -f {{.CORE}}
      - test "$(cat {{.CORE}}.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target/mgba {{.CORE}}
      - file {{.CORE}} | grep -q Mach-O
      - 'echo "built {{.CORE}}"'

  core:gpsp:host:
    desc: Fetch the host gpSP core from the libretro buildbot
    cmds:
      - task: core:buildbot
        vars: {LIB: gpsp}

  core:picodrive:host:
    desc: Fetch the host PicoDrive core from the libretro buildbot
    cmds:
      - task: core:buildbot
        vars: {LIB: picodrive}

  core:snes9x:host:
    desc: Fetch the host Snes9x core from the libretro buildbot
    cmds:
      - task: core:buildbot
        vars: {LIB: snes9x}

  core:mesen:host:
    desc: Fetch the host Mesen core from the libretro buildbot
    cmds:
      - task: core:buildbot
        vars: {LIB: mesen}

  core:pcsx:host:
    desc: Fetch the host pcsx_rearmed core from the libretro buildbot
    cmds:
      - task: core:buildbot
        vars: {LIB: pcsx_rearmed}

  core:supafaust:host:
    desc: >-
      Build Supafaust for this host from its pinned source archive and cores/supafaust's patches.
      The libretro buildbot builds none for macOS
    status:
      - test -f {{.SUPAFAUST_HOST}}
      - test "$(cat vendor/supafaust-src.sha 2>/dev/null)" = "{{.SUPAFAUST_COMMIT}}"
      - test "$(cat {{.SUPAFAUST_HOST}}.meta 2>/dev/null)" = "$(sh cores/supafaust/build.sh stamp {{.SUPAFAUST_COMMIT}})"
    cmds:
      - task: core:src
        vars: {NAME: supafaust, COMMIT: '{{.SUPAFAUST_COMMIT}}', FILE: Makefile}
      - >-
        sh cores/supafaust/build.sh build {{.SUPAFAUST_COMMIT}} vendor/supafaust-src.tar.gz
        target/supafaust {{.SUPAFAUST_HOST}}
      - file {{.SUPAFAUST_HOST}} | grep -q Mach-O
      - 'echo "built {{.SUPAFAUST_HOST}}"'

  core:buildbot:
    desc: Fetch LIB's core for this Mac from the libretro buildbot's nightlies
    internal: true
    requires:
      vars: [LIB]
    status:
      - test -f vendor/{{.LIB}}_libretro.dylib
    cmds:
      - |
        set -euo pipefail
        case "$(uname -m)" in
          arm64)  arch=arm64 ;;
          x86_64) arch=x86_64 ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p vendor
        curl -fsSL -o vendor/{{.LIB}}-host.zip \
          "https://buildbot.libretro.com/nightly/apple/osx/${arch}/latest/{{.LIB}}_libretro.dylib.zip"
        unzip -o -q vendor/{{.LIB}}-host.zip -d vendor
        rm -f vendor/{{.LIB}}-host.zip
        file vendor/{{.LIB}}_libretro.dylib | grep -q Mach-O
        echo "fetched vendor/{{.LIB}}_libretro.dylib"

  core:src:
    desc: >-
      Fetch OWNER/NAME's source archive at COMMIT into vendor/NAME-src.tar.gz, checking it
      holds FILE, and note the commit beside it in vendor/NAME-src.sha
    internal: true
    run: when_changed
    requires:
      vars: [NAME, COMMIT, FILE]
    vars:
      OWNER: '{{.OWNER | default "libretro"}}'
    status:
      - test -f vendor/{{.NAME}}-src.tar.gz
      - test "$(cat vendor/{{.NAME}}-src.sha 2>/dev/null)" = "{{.COMMIT}}"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/{{.NAME}}-src.tar.gz vendor/{{.NAME}}-src.sha
        curl -fsSL -o vendor/{{.NAME}}-src.tar.gz \
          "https://github.com/{{.OWNER}}/{{.NAME}}/archive/{{.COMMIT}}.tar.gz"
        tar -tzf vendor/{{.NAME}}-src.tar.gz | grep "^{{.NAME}}-{{.COMMIT}}/{{.FILE}}$" > /dev/null
        echo "{{.COMMIT}}" > vendor/{{.NAME}}-src.sha

  core:update:
    desc: >-
      Rebuild mGBA and Supafaust and re-fetch gpSP, PicoDrive, Snes9x and pcsx_rearmed for this host even
      if they are already vendored
    cmds:
      - >-
        rm -f {{.CORE}} {{.CORE}}.meta {{.GPSP_HOST}} {{.PICODRIVE_HOST}} {{.MESEN_HOST}} {{.SNES9X_HOST}} {{.SUPAFAUST_HOST}}
        {{.SUPAFAUST_HOST}}.meta {{.PCSX_HOST}}
      - task: core

  icons:
    desc: Re-fetch the nerd font symbols used by the HUD
    vars:
      ASSETS: crates/omega-ui/assets
      TTF: SymbolsNerdFontMono-Regular.ttf
    cmds:
      - |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/symbols.zip" \
          "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.zip"
        unzip -o -q "$tmp/symbols.zip" '{{.TTF}}' LICENSE -d "$tmp"
        mv "$tmp/{{.TTF}}" "{{.ASSETS}}/{{.TTF}}"
        mv "$tmp/LICENSE" "{{.ASSETS}}/{{.TTF}}.LICENSE.txt"
        echo "fetched {{.ASSETS}}/{{.TTF}}"

  bootlogos:
    desc: >-
      Render the boot images in card/System, one per panel: an old PC's BIOS screen after
      Award's, in the opening's letters, with the logo assets/logo/bioslogo.sh made (run it again
      after the logo changes; it needs ImageMagick)
    cmds:
      - cargo run -q -p omega-zero --example bootscreens -- card/System

  bootlogos:logo:
    desc: >-
      Render the boot images in card/System as they were before the BIOS screen: the logo from
      assets/logo/omega-zero-logo.html over the shelf's grid, one per panel so the grid stays
      whole. STYLE=smooth for the drawn-straight version instead of pixel art (needs Google
      Chrome and ImageMagick)
    vars:
      STYLE: '{{.STYLE | default "pixel"}}'
      LOGO_WIDTH: 414
    cmds:
      - |
        set -euo pipefail
        for size in 640x480 720x480 720x720; do
          assets/logo/bootlogo.sh {{.STYLE}} "${size%x*}" "${size#*x}" "card/System/bootlogo-$size.bmp" {{.LOGO_WIDTH}}
        done

  sdcard:
    desc: Create an empty content root, ROOT defaults to ./sdcard
    deps: [build]
    vars:
      ROOT: '{{.ROOT | default "./sdcard"}}'
    cmds:
      - ./target/debug/omega-zero --init-root {{.ROOT}}
      - 'echo "content root ready at {{.ROOT}}: roms in Games/GBA, Games/GB or Games/GBC, labels in the matching Labels/GBA, Labels/GB or Labels/GBC, battery saves in the matching Saves/GBA, Saves/GB or Saves/GBC, save states under the matching States/GBA, States/GB or States/GBC, gba_bios.bin in BIOS, pngs in Wallpapers, palette in Config/theme.txt, overlays in Overlays/GBA, Overlays/GB or Overlays/GBC named for the canvas, eg 640x480.png"'
      - 'echo "nothing is moved for you: a file loose at the top of Games/, Saves/, Labels/ or States/ is left where it is and never reaches the shelf"'

  run:
    desc: >-
      Run omega-zero against OMEGA_ROOT, defaults to ./sdcard. OMEGA_LINK_PORT moves the link
      session off 7211, which is what lets two copies on one machine link to each other -
      off-device both are on loopback, so the port is all that separates them
    deps: [core]
    env:
      OMEGA_ROOT: '{{.OMEGA_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run --release -p omega-zero

  run:bare:
    desc: Run with no title bar or border, for screenshots and screen capture
    deps: [core]
    env:
      OMEGA_ROOT: '{{.OMEGA_ROOT | default "./sdcard"}}'
      OMEGA_BARE: '1'
    cmds:
      - cargo run --release -p omega-zero

  run:debug:
    desc: Run an unoptimised build, for a debugger. Will not hold 60 fps.
    deps: [core]
    env:
      OMEGA_ROOT: '{{.OMEGA_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run -p omega-zero

  dist:
    desc: Build the copy-to-SD2 tree, OUT defaults to ./dist
    deps: [core, release]
    vars:
      OUT: '{{.OUT | default "dist"}}'
    cmds:
      - rm -rf {{.OUT}}
      - ./target/release/omega-zero --init-root {{.OUT}}
      - cp target/release/omega-zero {{.OUT}}/System/omega-zero
      - >-
        cp {{.CORE}} {{.GPSP_HOST}} {{.SNES9X_HOST}} {{.SUPAFAUST_HOST}} {{.PCSX_HOST}}
        {{.OUT}}/System/
      - 'echo "dist ready at {{.OUT}}, copy its contents to SD2"'

  core:device:
    desc: Build the aarch64 linux mgba core for the device bundle, in the box the device build uses
    status:
      - test -f vendor/mgba_libretro.so
      - test "$(cat vendor/mgba_libretro.so.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - task: device:sh
        vars:
          CMD: sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target-device/mgba vendor/mgba_libretro.so
      - file vendor/mgba_libretro.so | grep -q aarch64
      - 'echo "built vendor/mgba_libretro.so"'

  core:gpsp:
    desc: >-
      Build the aarch64 linux gpSP core from its pinned source archive, which ships beside it
      as its GPL-2.0 section 3(a) corresponding source
    status:
      - test -f vendor/gpsp_libretro.so
      - test -f vendor/gpsp-src.tar.gz
      - test "$(cat vendor/gpsp-src.sha 2>/dev/null)" = "{{.GPSP_COMMIT}}"
      - test "$(cat vendor/gpsp_libretro.so.meta 2>/dev/null)" = "$(sh cores/gpsp/build.sh stamp {{.GPSP_COMMIT}})"
      - test "$(cat vendor/gpsp-src.meta 2>/dev/null)" = "$(sh cores/gpsp/build.sh stamp {{.GPSP_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/gpsp_libretro.so vendor/gpsp_libretro.so.meta \
              vendor/gpsp-src.tar.gz vendor/gpsp-src.sha vendor/gpsp-src.meta
        curl -fsSL -o vendor/gpsp-src.tar.gz \
          "https://github.com/libretro/gpsp/archive/{{.GPSP_COMMIT}}.tar.gz"
        tar -tzf vendor/gpsp-src.tar.gz | grep "^gpsp-{{.GPSP_COMMIT}}/Makefile$" > /dev/null
      - task: device:sh
        vars:
          CMD: >-
            sh cores/gpsp/build.sh build {{.GPSP_COMMIT}} vendor/gpsp-src.tar.gz
            target-device/gpsp vendor/gpsp_libretro.so
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - echo "{{.GPSP_COMMIT}}" > vendor/gpsp-src.sha
      - cp vendor/gpsp_libretro.so.meta vendor/gpsp-src.meta
      - 'echo "built vendor/gpsp_libretro.so from vendor/gpsp-src.tar.gz @ {{.GPSP_COMMIT}}"'

  core:gpsp:update:
    desc: Refetch gpSP's source archive and rebuild the core from it, even if the set is current
    cmds:
      - >-
        rm -f vendor/gpsp_libretro.so vendor/gpsp_libretro.so.meta vendor/gpsp-src.tar.gz
        vendor/gpsp-src.sha vendor/gpsp-src.meta
      - task: core:gpsp

  core:gpsp:test:
    desc: Prove gpSP's Advance Wars session-flip patch still fixes what it was written for
    deps: [core:gpsp]
    cmds:
      - sh cores/gpsp/test/run.sh vendor/gpsp-src.tar.gz

  core:snes9x:
    desc: >-
      Build the aarch64 linux Snes9x core from its pinned source archive. Its licence allows
      non-commercial use only; the archive ships beside it for the LGPL-2.1 NTSC filter inside
    status:
      - test -f vendor/snes9x_libretro.so
      - test "$(cat vendor/snes9x-src.sha 2>/dev/null)" = "{{.SNES9X_COMMIT}}"
      - test "$(cat vendor/snes9x_libretro.so.meta 2>/dev/null)" = "$(sh cores/snes9x/build.sh stamp {{.SNES9X_COMMIT}})"
    cmds:
      - task: core:src
        vars: {NAME: snes9x, COMMIT: '{{.SNES9X_COMMIT}}', FILE: libretro/Makefile}
      - task: device:sh
        vars:
          CMD: >-
            sh cores/snes9x/build.sh build {{.SNES9X_COMMIT}} vendor/snes9x-src.tar.gz
            target-device/snes9x vendor/snes9x_libretro.so
      - file vendor/snes9x_libretro.so | grep -q aarch64
      - 'echo "built vendor/snes9x_libretro.so from vendor/snes9x-src.tar.gz @ {{.SNES9X_COMMIT}}"'

  core:mesen:
    desc: Build the aarch64 Linux Mesen core for NES and Famicom
    status:
      - test -f vendor/mesen_libretro.so
      - test "$(cat vendor/mesen-src.sha 2>/dev/null)" = "{{.MESEN_COMMIT}}"
      - test "$(cat vendor/mesen_libretro.so.meta 2>/dev/null)" = "$(sh cores/mesen/build.sh stamp {{.MESEN_COMMIT}})"
    cmds:
