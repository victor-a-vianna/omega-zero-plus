  core:picodrive:
    desc: Build the aarch64 Linux PicoDrive core for Genesis, 32X and Sega CD
    status:
      - test -f vendor/picodrive_libretro.so
      - test "$(cat vendor/picodrive-src.sha 2>/dev/null)" = "{{.PICODRIVE_COMMIT}}"
      - test "$(cat vendor/picodrive_libretro.so.meta 2>/dev/null)" = "$(sh cores/picodrive/build.sh stamp {{.PICODRIVE_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        source_dir="target-device/picodrive-source"
        rm -f vendor/picodrive-src.tar.gz vendor/picodrive-src.sha
        rm -rf "$source_dir"
        git clone --quiet --no-checkout https://github.com/notaz/picodrive.git "$source_dir/picodrive-{{.PICODRIVE_COMMIT}}"
        git -C "$source_dir/picodrive-{{.PICODRIVE_COMMIT}}" checkout --quiet {{.PICODRIVE_COMMIT}}
        git -C "$source_dir/picodrive-{{.PICODRIVE_COMMIT}}" submodule update --init --recursive --quiet
        tar --exclude='.git' --exclude='.git/*' -czf vendor/picodrive-src.tar.gz \
          -C "$source_dir" "picodrive-{{.PICODRIVE_COMMIT}}"
        tar -tzf vendor/picodrive-src.tar.gz | grep "^picodrive-{{.PICODRIVE_COMMIT}}/Makefile.libretro$" > /dev/null
        tar -tzf vendor/picodrive-src.tar.gz | grep "^picodrive-{{.PICODRIVE_COMMIT}}/platform/libpicofe/plat.h$" > /dev/null
        echo "{{.PICODRIVE_COMMIT}}" > vendor/picodrive-src.sha
      - task: device:sh
        vars:
          CMD: >-
            sh cores/picodrive/build.sh build {{.PICODRIVE_COMMIT}} vendor/picodrive-src.tar.gz
            target-device/picodrive vendor/picodrive_libretro.so
      - file vendor/picodrive_libretro.so | grep -q aarch64

