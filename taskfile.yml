  core:arduous:
    desc: Build the aarch64 Linux Arduous core for Arduboy
    status:
      - test -f vendor/arduous_libretro.so
      - test "$(cat vendor/arduous-src.sha 2>/dev/null)" = "{{.ARDUOUS_COMMIT}}"
      - test "$(cat vendor/arduous_libretro.so.meta 2>/dev/null)" = "$(sh cores/arduous/build.sh stamp {{.ARDUOUS_COMMIT}})"
    cmds:
      - rm -rf vendor/arduous-{{.ARDUOUS_COMMIT}} vendor/arduous-src.tar.gz vendor/arduous-src.sha
      - git clone --recursive https://github.com/libretro/arduous.git vendor/arduous-{{.ARDUOUS_COMMIT}}
      - git -C vendor/arduous-{{.ARDUOUS_COMMIT}} checkout {{.ARDUOUS_COMMIT}}
      - git -C vendor/arduous-{{.ARDUOUS_COMMIT}} submodule update --init --recursive
      - COPYFILE_DISABLE=1 tar --no-xattrs --exclude='.git' -czf vendor/arduous-src.tar.gz -C vendor arduous-{{.ARDUOUS_COMMIT}}
      - echo '{{.ARDUOUS_COMMIT}}' > vendor/arduous-src.sha
      - rm -rf vendor/arduous-{{.ARDUOUS_COMMIT}}
      - task: device:sh
        vars:
          IMAGE: rust:1-bullseye
          CMD: >-
            command -v cmake >/dev/null 2>&1 ||
            (apt-get update && apt-get install -y --no-install-recommends cmake);
            sh cores/arduous/build.sh build {{.ARDUOUS_COMMIT}}
            vendor/arduous-src.tar.gz target-device/arduous vendor/arduous_libretro.so
      - file vendor/arduous_libretro.so | grep -q aarch64

