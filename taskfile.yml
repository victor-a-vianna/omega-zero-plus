  GPSP_HOST: vendor/gpsp_libretro.dylib
  PICODRIVE_HOST: vendor/picodrive_libretro.dylib
  MESEN_HOST: vendor/mesen_libretro.dylib
  SNES9X_HOST: vendor/snes9x_libretro.dylib
  SUPAFAUST_HOST: vendor/mednafen_supafaust_libretro.dylib
  PCSX_HOST: vendor/pcsx_rearmed_libretro.dylib
  MGBA_COMMIT: e31759b24e7a4e3899285ff720d7b573ac328ae7
  GPSP_COMMIT: 7b2dd37394e2822110cacef321e9bb291a305b77
  PICODRIVE_COMMIT: 26ecb2b6358fefba24e3d68b9eb2efba7f10d5ee
  MESEN_COMMIT: 0102910c39ad1a62bc3f784466f3f67ca9eae335
