  BEETLE_WSWAN_COMMIT: 4b01295838ea89e3f1355bbe4cb5cf98aa6108cd
  SAMEDUCK_COMMIT: 040e19c379f00dae10afe0eb0c1b2b019b985bbe
  POTATOR_COMMIT: 227c5f6f3ce74d32e9002ce24c1420288559a860
  TIC80_COMMIT: 14fd99edc29962778bc88d81773288ffc6e8aa53
  TIC80_ENGINE_COMMIT: 4609f5f724b5f5398a591532c1a6e71bb747ca4f
  JAXE_COMMIT: c767afd785e01a15bcd575a2d93b737add82b675
  RETRO8_COMMIT: ddc06a142398ee9755894b3f0bb17c8dc428151d
  SQUIRRELJME_COMMIT: 58c64581371c8ab46a3a711de3a0e8aec3829674
  VIRCON32_COMMIT: 8b4ff35efb0f3a4c2599fa85ec0e588713f83182
  UZEM_COMMIT: d991ee94547c8294abc1c4cb73d63116aa58b5bc
  HYPSEUS_COMMIT: 4cfd20d834ee6cf42c1c347ffd2627d87aaf8e2f
  HANDY_COMMIT: bc55d462f0b2d6b073ea93dc552ebd73cec60fd1
  HATARI_COMMIT: ab55c3ed0e620c91e7f059a6d3fbef7acf9bfca8
  QUASI88_COMMIT: 7884be5277776a5d8c4fdc4e574e9b5b589945c9
  NP2KAI_COMMIT: 1ea561cd7fd62b33f4e7b3f1c2e30fc3e6089f28
  BEETLE_NGP_COMMIT: a50d5ac288a81f2104ddf43195a4efdd15c72227
  BEETLE_PCE_FAST_COMMIT: 4eee99c451f85ebe66d1591de88b892015b23059
  BEETLE_SUPERGRAFX_COMMIT: 9c11dcd213a79d57d2c86313971631af801f2cdc
  BEETLE_PCFX_COMMIT: c1650bad5fbdcc3c3ccd45e29e3983e1ccf16cff
  FBNEO_COMMIT: 32958a89abd645ed20387c8d31d21ede3bc48161
  MAME2003_PLUS_COMMIT: b168882c39c9194be08819634f97e8fc24635036
  GP32EMU_COMMIT: 9ca3a72fac79eb57dd16ec21f3756e243e4a579d
  PUAE_COMMIT: 356160901b4563a60d663829a2e1d07a9207671c
  VECX_COMMIT: dccff5402a16d1ea7c112095a8e42632bf149506
  SNES9X_COMMIT: fae2fea08f74180759ef540ee94259213f503480
  SUPAFAUST_COMMIT: 642d1d1b6684aa7e306a02a89885f3f5456a5157
  PCSX_COMMIT: c8816799b50388e61cfe237fe2cdbb7d8175f20a
  BIGPEMU_VERSION: v1221
