  # Daphne/Hypseus are standalone runtimes and are likewise omitted by the H700 profile.
  H700_DEVICE_CORES: mgba gpsp picodrive mesen stella2023 atari800 prosystem handy hatari2014 mednafen_vb pokemini gw arduous mednafen_wswan sameduck potator tic80 jaxe retro8 squirreljme vircon32 uzem mednafen_ngp mednafen_pce_fast mednafen_supergrafx fbneo mame2003_plus vecx snes9x mednafen_supafaust pcsx_rearmed
