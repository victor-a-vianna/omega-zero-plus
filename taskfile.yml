  # The libretro names of the cores the device bundle ships, <name>_libretro.so in System/
  DEVICE_CORES: mgba gpsp picodrive mesen stella2023 atari800 prosystem handy hatari2014 quasi88 np2kai mednafen_vb pokemini gw arduous mednafen_wswan sameduck potator tic80 jaxe retro8 squirreljme vircon32 uzem mednafen_ngp mednafen_pce_fast mednafen_supergrafx mednafen_pcfx fbneo mame2003_plus gp32emu vecx puae snes9x mednafen_supafaust pcsx_rearmed
