    deps: [core:device, core:gpsp, core:picodrive, core:mesen, core:stella2023, core:atari800, core:prosystem, core:handy, core:hatari, core:quasi88, core:np2kai, core:beetle-vb, core:pokemini, core:gw, core:arduous, core:beetle-wswan, core:sameduck, core:potator, core:tic80, core:jaxe, core:retro8, core:squirreljme, core:vircon32, core:uzem, core:beetle-ngp, core:beetle-pce-fast, core:beetle-supergrafx, core:beetle-pcfx, core:fbneo, core:mame2003-plus, core:gp32emu, core:vecx, core:puae, core:snes9x, core:supafaust, core:pcsx]

  cores:h700:
    desc: Build only the cores shipped in the H700 profile
    deps: [core:device, core:gpsp, core:picodrive, core:mesen, core:stella2023, core:atari800, core:prosystem, core:handy, core:hatari, core:beetle-vb, core:pokemini, core:gw, core:arduous, core:beetle-wswan, core:sameduck, core:potator, core:tic80, core:jaxe, core:retro8, core:squirreljme, core:vircon32, core:uzem, core:beetle-ngp, core:beetle-pce-fast, core:beetle-supergrafx, core:fbneo, core:mame2003-plus, core:vecx, core:snes9x, core:supafaust, core:pcsx]

  device:sh:
    desc: >-
      Run CMD on the box the device build wants, fetching one if this is not it. The container
      keeps the pinned toolchain and the crates it downloads in two docker volumes, so a build
      does not fetch them all again
    internal: true
    requires:
      vars: [CMD]
    vars:
      IMAGE: '{{.IMAGE | default "rust:1-bullseye"}}'
    cmds:
      - |
        set -eu
        if [ "$(uname -s)-$(uname -m)" = "Linux-aarch64" ]; then
          sh -c '{{.CMD}}'
        else
          docker run --rm -e OMEGA_SS_DEVID -e OMEGA_SS_DEVPASSWORD \
            -v omega-zero-rustup:/usr/local/rustup -v omega-zero-cargo:/usr/local/cargo/registry \
            -v "$PWD":/src -w /src {{.IMAGE}} sh -c '{{.CMD}}'
        fi

  build:device:
    desc: >-
      Build for the H700, in an arm64 container unless this is already one. PROFILE=device-dev
      skips the release build's whole-program optimisation, for a build in seconds while trying
      a change on the console
    vars:
      PROFILE: '{{.PROFILE | default "device"}}'
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile {{.PROFILE}} --target-dir target-device
            -p omega-zero --no-default-features --features device,h700
      - file target-device/{{.PROFILE}}/omega-zero | grep -q aarch64
      - 'echo "built target-device/{{.PROFILE}}/omega-zero"'

  bench:device:
    desc: Build core_bench, omega-retro's headless core benchmark, for the H700. It never ships
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile device --target-dir target-device
            -p omega-retro --example core_bench
      - file target-device/device/examples/core_bench | grep -q aarch64
      - 'echo "built target-device/device/examples/core_bench, adb push it to /tmp/core_bench"'

  dist:device:
    desc: Build the SD2 tree for an H700 device, OUT defaults to ./dist-device
    deps: [cores:h700, build:device]
    vars:
      OUT: '{{.OUT | default "dist-device"}}'
    cmds:
      - rm -rf {{.OUT}}
      - task: device:sh
        vars:
          CMD: ./target-device/device/omega-zero --init-root {{.OUT}}
      - cp target-device/device/omega-zero {{.OUT}}/System/omega-zero
      - cp -R card/System/. {{.OUT}}/System/
      - rm -rf {{.OUT}}/System/hypseus {{.OUT}}/System/bigpemu
      - |
        set -eu
        for lib in {{.H700_DEVICE_CORES}}; do
          file "vendor/${lib}_libretro.so" | grep -q aarch64
          cp "vendor/${lib}_libretro.so" {{.OUT}}/System/
        done
      - cp -r licenses {{.OUT}}/System/licenses
      - cp vendor/squirreljme-0.3.0-fast.jar {{.OUT}}/BIOS/
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        cp vendor/gpsp-src.tar.gz "{{.OUT}}/System/licenses/gpsp-${sha}.tar.gz"
        cp vendor/gpsp-src.meta "{{.OUT}}/System/licenses/gpsp-${sha}.meta"
        for p in cores/gpsp/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/gpsp-$(basename "$p")"
        done
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        cp vendor/mgba_libretro.so.meta "{{.OUT}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/mgba-$(basename "$p")"
        done
      - |
        set -euo pipefail
        # Supafaust and pcsx_rearmed are GPL-2.0 as gpSP is, and Snes9x holds the LGPL-2.1
        # snes_ntsc filter: each ships its source archive, build stamp and patches beside it
        for core in {{.H700_SOURCE_CORES}}; do
          name="${core%%:*}" lib="${core#*:}"
          sha="$(cat "vendor/$name-src.sha")"
          cp "vendor/$name-src.tar.gz" "{{.OUT}}/System/licenses/$name-${sha}.tar.gz"
          cp "vendor/${lib}_libretro.so.meta" "{{.OUT}}/System/licenses/$name-${sha}.meta"
          for p in cores/$name/*.patch; do
            [ -f "$p" ] || continue
            cp "$p" "{{.OUT}}/System/licenses/$name-$(basename "$p")"
          done
        done
      - 'echo "device tree ready at {{.OUT}}, copy its contents to SD2"'

  bigpemu:install:
    desc: >-
      Install the unmodified official Linux ARM64 BigPEmu archive into an existing personal
      device tree. ROOT defaults to dist-device; GL4ES may point to H700's libGL.so.1 bridge.
    requires:
      vars: [ARCHIVE]
    vars:
      ROOT: '{{.ROOT | default "dist-device"}}'
    cmds:
      - >-
        sh scripts/install-bigpemu.sh "{{.ARCHIVE}}" "{{.ROOT}}"
        {{if .GL4ES}}"{{.GL4ES}}"{{else}}vendor/bigpemu-libGL.so.1{{end}}
        {{if .SDL2}}"{{.SDL2}}"{{else}}vendor/bigpemu-libSDL2-2.0.so.0{{end}}

  bigpemu:gl4es:
    desc: Build the pinned ARM64 GL4ES bridge used by BigPEmu on GLES-only devices
    status:
      - test -f vendor/bigpemu-libGL.so.1
      - test "$(sed -n 's/^commit=//p' vendor/bigpemu-libGL.so.1.meta 2>/dev/null)" = "{{.GL4ES_COMMIT}}"
      - test "$(sed -n 's/^options=//p' vendor/bigpemu-libGL.so.1.meta 2>/dev/null)" = "ODROID,NOX11,NOEGL"
    cmds:
      - |
        set -eu
        mkdir -p vendor
        if [ ! -f vendor/gl4es-src.tar.gz ] || [ "$(cat vendor/gl4es-src.sha 2>/dev/null)" != "{{.GL4ES_COMMIT}}" ]; then
          curl -fsSL -o vendor/gl4es-src.tar.gz \
            "https://github.com/ptitSeb/gl4es/archive/{{.GL4ES_COMMIT}}.tar.gz"
          echo "{{.GL4ES_COMMIT}}" > vendor/gl4es-src.sha
        fi
      - task: device:sh
        vars:
          IMAGE: rust:1-bookworm
          CMD: >-
            command -v cmake >/dev/null 2>&1 ||
            (apt-get update && apt-get install -y --no-install-recommends cmake);
            sh standalone/bigpemu/build-gl4es.sh {{.GL4ES_COMMIT}}
            vendor/gl4es-src.tar.gz target-device/gl4es vendor/bigpemu-libGL.so.1
      - file vendor/bigpemu-libGL.so.1 | grep -q aarch64

  bigpemu:sdl2:
    desc: Build the SDL2 mali-fbdev runtime required by BigPEmu on BaseOS/H700
    status:
      - test -f vendor/bigpemu-libSDL2-2.0.so.0
      - test "$(sed -n 's/^version=//p' vendor/bigpemu-libSDL2-2.0.so.0.meta 2>/dev/null)" = "{{.BIGPEMU_SDL2_VERSION}}"
      - test "$(sed -n 's/^backend=//p' vendor/bigpemu-libSDL2-2.0.so.0.meta 2>/dev/null)" = "mali-fbdev"
    cmds:
      - |
        set -eu
        mkdir -p vendor
        if [ ! -f vendor/SDL2-{{.BIGPEMU_SDL2_VERSION}}.tar.gz ] || \
           ! echo "{{.BIGPEMU_SDL2_SHA256}}  vendor/SDL2-{{.BIGPEMU_SDL2_VERSION}}.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
          curl -fsSL -o vendor/SDL2-{{.BIGPEMU_SDL2_VERSION}}.tar.gz \
            "https://www.libsdl.org/release/SDL2-{{.BIGPEMU_SDL2_VERSION}}.tar.gz"
        fi
        echo "{{.BIGPEMU_SDL2_SHA256}}  vendor/SDL2-{{.BIGPEMU_SDL2_VERSION}}.tar.gz" | sha256sum -c -
      - >-
        docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src ubuntu:22.04 sh -euc '
        export DEBIAN_FRONTEND=noninteractive;
        apt-get update >/dev/null;
        apt-get install -y --no-install-recommends build-essential cmake ninja-build
        libasound2-dev libudev-dev libegl-dev libgles-dev patch binutils >/dev/null;
        sh standalone/bigpemu/build-sdl2.sh {{.BIGPEMU_SDL2_VERSION}}
        vendor/SDL2-{{.BIGPEMU_SDL2_VERSION}}.tar.gz standalone/bigpemu/sdl2-patches
        target-device/bigpemu-sdl2 vendor/bigpemu-libSDL2-2.0.so.0'
      - file vendor/bigpemu-libSDL2-2.0.so.0 | grep -q aarch64

  hypseus:
    desc: Build and package Hypseus Singe for the H700
    deps: [bigpemu:sdl2]
    status:
      - test -x vendor/hypseus/hypseus
      - test "$(cat vendor/hypseus-src.sha 2>/dev/null)" = "{{.HYPSEUS_COMMIT}}"
      - test "$(cat vendor/hypseus/hypseus.meta 2>/dev/null)" = "$(sh standalone/hypseus/build.sh stamp {{.HYPSEUS_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        curl -fsSL -o vendor/hypseus-src.tar.gz \
          "https://github.com/DirtBagXon/hypseus-singe/archive/{{.HYPSEUS_COMMIT}}.tar.gz"
        tar -tzf vendor/hypseus-src.tar.gz | \
          grep -q '^hypseus-singe-{{.HYPSEUS_COMMIT}}/src/CMakeLists.txt$'
        echo "{{.HYPSEUS_COMMIT}}" > vendor/hypseus-src.sha
      - task: device:sh
        vars:
          IMAGE: rust:1-bookworm
          CMD: >-
            apt-get update && apt-get install -y --no-install-recommends
            cmake pkg-config pax-utils libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
            libsdl2-mixer-dev libzip-dev libvorbis-dev;
            sh standalone/hypseus/build.sh build {{.HYPSEUS_COMMIT}}
            vendor/hypseus-src.tar.gz target-device/hypseus vendor/hypseus
            vendor/bigpemu-libSDL2-2.0.so.0
      - file vendor/hypseus/hypseus | grep -q aarch64

  hypseus:update:
    desc: Refetch and rebuild Hypseus Singe for H700
    cmds:
      - rm -rf vendor/hypseus vendor/hypseus-src.tar.gz vendor/hypseus-src.sha
      - task: hypseus

  deploy:device:
    desc: Build and push onto a device over adb, then restart it. SD defaults to /mnt/sdcard
    deps: [cores:h700, build:device]
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb wait-for-device
      - |
        set -eu
        for lib in {{.H700_DEVICE_CORES}}; do
          file "vendor/${lib}_libretro.so" | grep -q aarch64
        done
      - adb push target-device/device/omega-zero '{{.SD}}/System/omega-zero'
      - adb push card/System/. '{{.SD}}/System/'
      - |
        adb shell 'rm -rf {{.SD}}/System/hypseus {{.SD}}/System/bigpemu {{.SD}}/System/source/hypseus'
        adb shell 'find {{.SD}}/System/licenses -maxdepth 1 -name "hypseus-*" -delete 2>/dev/null || true'
      - |
        set -euo pipefail
        for lib in {{.H700_DEVICE_CORES}}; do
          adb push "vendor/${lib}_libretro.so" "{{.SD}}/System/${lib}_libretro.so"
        done
      - adb push licenses '{{.SD}}/System/'
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        adb push vendor/gpsp-src.tar.gz "{{.SD}}/System/licenses/gpsp-${sha}.tar.gz"
        adb push vendor/gpsp-src.meta "{{.SD}}/System/licenses/gpsp-${sha}.meta"
        for p in cores/gpsp/*.patch; do
          adb push "$p" "{{.SD}}/System/licenses/gpsp-$(basename "$p")"
        done
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        adb push vendor/mgba_libretro.so.meta "{{.SD}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          adb push "$p" "{{.SD}}/System/licenses/mgba-$(basename "$p")"
        done
      - |
        set -euo pipefail
        for core in {{.H700_SOURCE_CORES}}; do
          name="${core%%:*}" lib="${core#*:}"
          sha="$(cat "vendor/$name-src.sha")"
          adb push "vendor/$name-src.tar.gz" "{{.SD}}/System/licenses/$name-${sha}.tar.gz"
          adb push "vendor/${lib}_libretro.so.meta" "{{.SD}}/System/licenses/$name-${sha}.meta"
          for p in cores/$name/*.patch; do
            [ -f "$p" ] || continue
            adb push "$p" "{{.SD}}/System/licenses/$name-$(basename "$p")"
          done
        done
      - adb shell 'chmod +x {{.SD}}/System/omega-zero && sync'
      - adb reboot
      - adb wait-for-device
      - 'echo "deployed to {{.SD}}, device rebooting"'

  log:device:
    desc: Read omega-zero's log back off a connected device
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb shell 'cat {{.SD}}/omega-zero.log'

  deploy:wifi:
    desc: >-
      Build omega-zero and copy it onto a console on the home network over SSH, then reboot it
      into the new build and wait until it starts. CONSOLE defaults to rg35xxsp.local and SD to
      /mnt/sdcard. CONSOLE_PASSWORD defaults to the first line of .console-password at the
      repo's root (git ignores it), else root; the console shows its password under Settings >
      Network, Y on SSH. PROFILE defaults to device-dev, quick to build; PROFILE=device
      copies the shipping build. SCRIPTS=1 copies card/System's scripts too. CORES=1 builds
      the six cores the bundle ships and copies them into System/ too. A game still running
      loses whatever it has not saved
    vars:
      PROFILE: '{{.PROFILE | default "device-dev"}}'
    env:
      CONSOLE: '{{.CONSOLE}}'
      SD: '{{.SD}}'
      CONSOLE_PASSWORD: '{{.CONSOLE_PASSWORD}}'
      CORES: '{{.CORES}}'
      DEVICE_CORES: '{{.H700_DEVICE_CORES}}'
    cmds:
      - task: cores:h700
        if: '[ -n "{{.CORES}}" ]'
      - task: build:device
        vars:
          PROFILE: '{{.PROFILE}}'
      - sh scripts/console.sh deploy target-device/{{.PROFILE}}/omega-zero {{if .SCRIPTS}}card/System/*.sh{{end}}

  log:wifi:
    desc: >-
      Read omega-zero's log off a console on the home network, CONSOLE, SD and CONSOLE_PASSWORD
      (or .console-password) as deploy:wifi
    env:
      CONSOLE: '{{.CONSOLE}}'
      SD: '{{.SD}}'
      CONSOLE_PASSWORD: '{{.CONSOLE_PASSWORD}}'
    cmds:
      - sh scripts/console.sh log

  clean:
    desc: Remove build output and dist
    cmds:
      - cargo clean
      - rm -rf dist dist-device target-device
