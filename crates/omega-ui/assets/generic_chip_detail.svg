  <path d="M 72 51 H 348 Q 369 51 369 72" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="5"/>
  <path d="M 369 72 V 348 Q 369 369 348 369 H 72" fill="none" stroke="#000" stroke-opacity="0.44" stroke-width="6"/>
  <!-- Pin-one marker and four subtle mould marks are the only face details. -->
