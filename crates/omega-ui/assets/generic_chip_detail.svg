  <circle cx="338" cy="82" r="8" fill="#000" fill-opacity="0.24"/>
  <circle cx="82" cy="338" r="8" fill="#000" fill-opacity="0.24"/>
  <circle cx="338" cy="338" r="8" fill="#000" fill-opacity="0.24"/>
