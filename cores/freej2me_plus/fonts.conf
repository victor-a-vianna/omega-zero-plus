<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/lib/fonts</dir>
  <cachedir>/tmp/freej2me-fontconfig-cache</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Pixel Code</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Pixel Code</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Pixel Code</family></prefer>
  </alias>
</fontconfig>
